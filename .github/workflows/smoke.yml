# ir-search first-page smoke canary
#
# 소스 사이트(K-Startup·기업마당·NIPA·KOCCA·SMTECH)의 API/HTML 계약이
# 조용히 깨지는 걸 조기 감지한다. 각 크롤러를 --max-pages 1 --smoke
# (첫 페이지만, coverage 검증만 완화)로 실행하는 저부하 스모크 —
# 전수 크롤 금지(대상 사이트 부담), 요청 간 딜레이는 스크립트 기본을 그대로 쓴다.
# --smoke 는 page-cap·min_expected coverage 검증만 완화한다:
# 첫 페이지 0건 파싱 = 계약 파손 = job 실패 → 그게 곧 알림이다.
#
# 단, 네트워크 도달 실패는 계약 파손이 아니다. 러너는 해외 IP라서 일부
# 한국 공공기관 사이트에 아예 닿지 못하거나 간헐 타임아웃이 난다
# (2026-07-27 관측: bizinfo가 한 실행에서 HTTP 28 타임아웃 → 같은 커밋
# 재실행에서 정상. 한국 IP 로컬에서는 항상 정상). 그래서 모든 라이브
# 스텝은 .github/smoke_step.sh 를 거친다 — 도달 실패는 1회 재시도 후
# ::warning:: 으로 강등하고, 계약 파손만 job을 빨갛게 만든다.
#
# 소스는 한 스텝에 몰지 않고 개별 실행한다. `list all` 로 묶으면 한 소스의
# 도달 실패가 같은 출력에 섞여, 다른 소스의 진짜 계약 파손까지 warning 으로
# 강등돼 묻힌다.
name: smoke

on:
  schedule:
    - cron: "0 3 * * 1,4" # 월·목 03:00 UTC (KST 12:00) 주 2회
  workflow_dispatch:
  push:

jobs:
  pytest:
    # fixture 기반 단위 테스트 — 네트워크 없음, push에도 돈다 (tests/ 전체)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 크롤러는 표준 라이브러리만 쓴다 — 테스트 실행에 pytest만 설치
      - run: python -m pip install pytest
      - run: python -m pytest tests/ -q

  smoke:
    # 라이브 첫 페이지 확인 — 스케줄/수동 실행만 (push마다 외부 사이트를 치지 않는다)
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SCRIPTS: skills/ir-search/scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 크롤러는 curl_cffi(Safari TLS 지문)로 접근한다 — 없으면 urllib로 폴백하는데
      # 그 경우 대상 사이트가 TLS 지문으로 차단할 수 있어(SKILL.md), canary가 계약
      # 파손이 아닌 접근 차단을 오탐한다. 프로덕션과 동일 조건을 만들기 위해 설치한다.
      - run: python -m pip install 'curl_cffi>=0.15'

      - name: kstartup list first page
        run: >
          bash .github/smoke_step.sh kstartup
          python3 $SCRIPTS/kstartup_crawl.py list -o /tmp/kstartup.jsonl
          --max-pages 1 --smoke

      - name: bizinfo list first page
        if: ${{ !cancelled() }}
        run: >
          bash .github/smoke_step.sh bizinfo
          python3 $SCRIPTS/sources_crawl.py list bizinfo -o /tmp/bizinfo.jsonl
          --max-pages 1 --smoke

      - name: nipa list first page
        if: ${{ !cancelled() }}
        run: >
          bash .github/smoke_step.sh nipa
          python3 $SCRIPTS/sources_crawl.py list nipa -o /tmp/nipa.jsonl
          --max-pages 1 --smoke

      - name: kocca list first page
        if: ${{ !cancelled() }}
        run: >
          bash .github/smoke_step.sh kocca
          python3 $SCRIPTS/sources_crawl.py list kocca -o /tmp/kocca.jsonl
          --max-pages 1 --smoke

      - name: smtech list first page
        if: ${{ !cancelled() }}
        run: >
          bash .github/smoke_step.sh smtech
          python3 $SCRIPTS/sources_crawl.py list smtech -o /tmp/smtech.jsonl
          --max-pages 1 --smoke
